name: Release

# Publish a release on GitHub (tag like v0.1.0) and this attaches the
# installable zip to it. The tag must match the version in
# print_splitter/blender_manifest.toml.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  zip:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches the add-on version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' print_splitter/blender_manifest.toml)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME doesn't match manifest version $version"
            exit 1
          fi
      - name: Build zip
        run: python3 tools/build_zip.py
      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
